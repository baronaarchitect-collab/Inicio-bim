<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio de Salas Life City</title>
<meta name="description" content="Estudio de Life City: crea por proyecto el Typeform, el recorrido virtual y el dashboard de la sala de ventas, importa la sala de renders y guarda todo en Firebase.">
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* Layout: estudio de trabajo. Barra superior con la sesión (Firebase); columna izquierda con los proyectos y las fuentes;
   derecha, el proyecto abierto en pestañas (Proyecto → Typeform → Recorrido virtual → Dashboard → Links), cada una pide lo que necesita. */
:root{
  --bg:#0c110e; --surface:#141d17; --raise:#1b271f; --line:#283a2d;
  --fg:#eef4ef; --soft:#c9dccd; --muted:#93ab99;
  --green:#5fae74; --gold:#d4ae5a; --sky:#79b9d8; --err:#ff8a7a; --warn:#e8b45a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(30px,4vw,44px);line-height:.95}
h2{font-size:26px;line-height:1}
h3{font-size:19px;line-height:1.05}
p{margin:0}
.kicker{font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.muted{color:var(--muted)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--raise);color:var(--fg);border-radius:6px;padding:8px 12px;font:700 14px var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.b:hover{border-color:var(--green)}
.b.p{background:var(--gold);color:#16130a;border-color:var(--gold)}
.b.sm{padding:5px 9px;font-size:13px}
.b:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px}
.auth{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.chip{font:600 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--soft)}
.chip.nube{border-color:var(--green);color:var(--green)}
.chip.local{border-color:var(--warn);color:var(--warn)}
.mail{display:flex;gap:6px;flex-wrap:wrap}
.mail input{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:14px var(--body);width:170px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plist{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow-y:auto}
.pi{text-align:left;border:1.5px solid var(--line);background:var(--raise);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;width:100%}
.pi[aria-current="true"]{border-color:var(--gold)}
.pi b{display:block;font-size:14.5px}
.pi small{color:var(--muted);font-size:12px}
.drop{border:1.5px dashed #4a5a4f}
.drop.over{border-color:var(--gold)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--soft);border-radius:99px;padding:6px 12px;font:700 13.5px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--gold);color:#16130a;border-color:var(--gold)}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.tabs .dot.ok{background:var(--green)}
.panel{display:flex;flex-direction:column;gap:14px}
.need{background:#2a2210;border:1px solid #5a4a1c;border-radius:8px;padding:10px 12px;font-size:14px;color:#f3dfa8}
.need.ok{background:#14261a;border-color:#2c5a38;color:#a9e0b8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,td input,td select{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:14.5px var(--body);min-width:0;width:100%}
.full{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface)}
td input[type=number]{width:90px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.amb{display:flex;flex-direction:column;gap:5px}
.amb .r{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 30px;gap:6px}
.amb input{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:14px var(--body);min-width:0;width:100%}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px}
.plan{background:#f8faf6;border-radius:8px;padding:6px}
.plan svg{display:block;width:100%;height:auto;max-height:240px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.stats b{display:block;font:800 24px var(--display);color:var(--gold);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats span{font-size:12px;color:var(--muted)}
.lk{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:8px;align-items:center}
.lk label{font:700 13.5px var(--body);color:var(--soft)}
.lk label small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.lk input{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:13.5px var(--mono);min-width:0;width:100%}
.state{font:500 12.5px var(--mono);color:var(--muted)}
.state.ok{color:var(--green)}.state.bad{color:var(--err)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}.tip{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lk{grid-template-columns:minmax(0,1fr) auto}.lk label{grid-column:1/-1}.amb .r{grid-template-columns:minmax(0,1fr) 64px 64px 26px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:4px"><span class="kicker">Life City · Estudio</span><h1>Salas de ventas por proyecto</h1></div>
    <div class="auth" id="auth"></div>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="box"><div class="row" style="justify-content:space-between"><b>Proyectos</b><button class="b sm p" id="nuevo" type="button">+ Nuevo</button></div><div class="plist" id="plist"></div></div>
      <div class="box drop" id="drop"><span class="kicker">Sala 14 · 2D + render</span><p class="muted" style="font-size:13.5px">Importa el JSON de la sala de renders (.sala.zip, proyecto.json o datos.js) como proyecto nuevo.</p><label class="b upl">Importar sala 14<input type="file" id="fileNew" accept=".zip,.json,.js"></label><div id="rlist" style="display:flex;flex-direction:column;gap:4px"></div></div>
      <div class="box"><span class="kicker">Otras fuentes</span><button class="b" id="fromKit" type="button">Último pedido de la Sales App</button><button class="b" id="fromAntonio" type="button">La Vista de San Eduardo (Antonio)</button></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var tt;function toast(m){var e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},3400)}
  function cop(m){return '$'+Math.round(+m||0).toLocaleString('es-CO')+' M'}
  function ext(n){return String(n||'').split('.').pop().toLowerCase()}
  function newId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
  var BASE=location.href.replace(/[^/]*([?#].*)?$/,'');
  var ESP=LCKit.ESPACIOS, S=LCStore;
  var NEG={planos:'Venta sobre planos',inmediata:'Venta de entrega inmediata',colaborativa:'Inversión colaborativa',renta:'Renta'};
  var LINKS=[['typeform','Typeform','Califica y recomienda'],['recorrido','Recorrido virtual','Planta navegable o 3D'],['sala','Sala de renders','Fachada → piso → apto'],['dashboard','Dashboard publicado','Precios y estados'],['propuesta','Propuesta','Para el cliente']];
  var TABS=[['proyecto','Proyecto'],['typeform','Typeform'],['recorrido','Recorrido virtual'],['dashboard','Dashboard'],['links','Links']];

  /* ===================== modelo del proyecto ===================== */
  function blank(){return {id:newId(),v:2,origen:'Nuevo',creado:Date.now(),
    datos:{proyecto:'',empresa:'',director:'',whatsapp:'',correo:'',ciudad:'Cali',zona:'Sur',negocio:'planos',entrega:'',salaDir:'',horarios:'Lunes a sábado · 9:00 a. m. a 6:00 p. m.',ticket:50,rentab:12},
    tipologias:[],unidades:[],recorrido:{visitante:''},archivos:{},links:{typeform:'',recorrido:'',sala:'',dashboard:'',propuesta:''}}}
  // ambientes base de las plantas de Antonio (m), se escalan al área de la tipología
  var BASES={
    1:{area:38,a:[['Espacio principal',6.2,4],['Cocina abierta',2.6,2.2],['Baño',1.8,2.2],['Balcón',1.8,2.2]]},
    2:{area:58,a:[['Sala-comedor',4.8,3.8],['Cocina',3.6,2],['Balcón',3.6,1.8],['Habitación principal',3.6,3.2],['Baño',1.8,1.8],['Zona de ropas',1.8,1.4],['Habitación 2',3,3.2]]},
    3:{area:82,a:[['Sala-comedor',5.6,4],['Cocina',2.6,2.4],['Balcón',1.8,2.4],['Habitación principal',4,4.2],['Baño principal',1.6,2],['Baño social',1.6,2.2],['Habitación 2',2.4,4.6],['Habitación 3 / estudio',2,4.6]]}
  };
  function sugeridos(hab,area){var B=BASES[Math.max(1,Math.min(3,+hab||2))],k=Math.sqrt((+area||B.area)/B.area);
    return B.a.map(function(x){return {n:x[0],w:Math.round(x[1]*k*20)/20,l:Math.round(x[2]*k*20)/20}})}
  function tipo(p,id){return p.tipologias.filter(function(t){return t.id===id})[0]}
  function nextTipId(p){var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<L.length;i++)if(!tipo(p,L[i]))return L[i];return 'T'+p.tipologias.length}
  function nuevaTip(p,o){var id=nextTipId(p);var t=Object.assign({id:id,nombre:'Tipo '+id,espacio:'apartamentos',area:68,hab:2,banos:2,precio:420,renta:2.3,para:'ambos'},o||{});t.ambientes=t.ambientes||sugeridos(t.hab,t.area);p.tipologias.push(t);return t}
  /* agrupa unidades sueltas (área, alcobas, baños) en tipologías */
  function tipsDesdeUnidades(p,U){
    var g={};U.forEach(function(u){var k=(u.tipo||'apartamentos')+'|'+Math.round((+u.area||0)/4)*4+'|'+(u.alcobas||'')+'|'+(u.banos||'');(g[k]=g[k]||[]).push(u)});
    Object.keys(g).sort(function(a,b){return (+a.split('|')[1])-(+b.split('|')[1])}).forEach(function(k){
      var L=g[k],u=L[0],area=Math.round(L.reduce(function(s,x){return s+(+x.area||0)},0)/L.length),hab=+u.alcobas||(area>=90?3:area>=50?2:1);
      var t=nuevaTip(p,{espacio:u.tipo&&ESP[u.tipo]?u.tipo:'apartamentos',area:area,hab:hab,banos:+u.banos||(hab>=3?2:1),precio:Math.round(L.reduce(function(s,x){return s+(+x.precio||0)},0)/L.length),renta:0});
      t.nombre='Tipo '+t.id+' · '+area+' m²';t.renta=Math.round(t.precio*0.0055*10)/10;
      L.forEach(function(x){x.tipologia=t.id});
    });
    p.unidades=U.map(function(u){return {id:String(u.id),tipologia:u.tipologia,piso:+u.piso||1,area:+u.area||0,precio:+u.precio||0,estado:u.estado||'disponible'}});
  }
  function fromRenders(S0,p){
    p=p||blank();p.origen='Sala 14 · renders';
    var U=(S0.unidades||[]).map(function(u){var f=(S0.pisos||[]).filter(function(x){return x.id===u.piso})[0]||{};
      return {id:u.id,tipo:'apartamentos',piso:+f.nivel||1,area:+u.area||0,alcobas:u.alcobas,banos:u.banos,precio:Math.round((+u.precio||0)/1e6),estado:u.estado}});
    var d=p.datos,nueva=!d.proyecto;d.proyecto=d.proyecto||S0.proyecto||'';d.empresa=d.empresa||S0.empresa||'';d.ciudad=(nueva&&S0.ciudad)||d.ciudad||S0.ciudad||'';d.whatsapp=d.whatsapp||String(S0.whatsapp||'').replace(/\D/g,'');
    d.zona=/norte/i.test(d.ciudad)?'Norte':/oeste/i.test(d.ciudad)?'Oeste':d.zona;
    p.tipologias=[];tipsDesdeUnidades(p,U);
    p.sala14={pisos:(S0.pisos||[]).length,plantas:(S0.plantas||[]).length,separacion:S0.separacion,paleta:(S0.recorrido||{}).paleta||[],decisiones:(S0.recorrido||{}).decisiones||[]};
    return p;
  }
  function fromPedido(D,origen){
    var p=blank();p.origen=origen;var d=p.datos;
    d.proyecto=D.proyecto||'';d.empresa=D.empresa||'';d.director=D.nombre||'';d.whatsapp=String(D.whatsapp||'').replace(/\D/g,'');d.correo=D.mail||'';d.ciudad=D.ciudad||'Cali';
    d.negocio=NEG[D.negocio]?D.negocio:'planos';d.entrega=D.entrega||'';d.ticket=D.ticket||50;d.rentab=D.rentab||12;
    tipsDesdeUnidades(p,(D.unidades||[]).map(function(u){return Object.assign({},u)}));
    if(D.links)Object.assign(p.links,D.links);
    return p;
  }

  /* ===================== qué falta por pestaña ===================== */
  function falta(p,tab){
    var d=p.datos,m=[];
    if(tab==='proyecto'){if(!d.proyecto)m.push('nombre del proyecto');if(!d.empresa)m.push('constructora');if((d.whatsapp||'').replace(/\D/g,'').length<10)m.push('WhatsApp de ventas con indicativo (57…)');if(!d.ciudad)m.push('ciudad');if(!d.salaDir)m.push('dirección de la sala de ventas')}
    if(tab==='typeform'){if(!p.tipologias.length)m.push('al menos una tipología');p.tipologias.forEach(function(t){if(!(t.area>0))m.push('área de '+t.nombre);if(!(t.precio>0))m.push('precio de '+t.nombre)});if((d.whatsapp||'').replace(/\D/g,'').length<10)m.push('WhatsApp (pestaña Proyecto)')}
    if(tab==='recorrido'){if(!p.tipologias.length)m.push('tipologías (pestaña Typeform)');p.tipologias.forEach(function(t){var ok=(t.ambientes||[]).filter(function(a){return a.n&&a.w>0&&a.l>0});if(ok.length<2)m.push('ambientes de '+t.nombre)})}
    if(tab==='dashboard'){if(!p.unidades.length)m.push('unidades (importa la sala 14 o créalas desde las tipologías)');if(p.unidades.some(function(u){return !(u.precio>0)}))m.push('precio de todas las unidades')}
    return m;
  }

  /* ===================== Typeform y recorrido (plantilla de Antonio) ===================== */
  function rid(n,used,i){var s=n.toLowerCase(),c;
    if(/sala|estar|espacio principal|social$/.test(s)&&!/baño/.test(s))c='sala';else if(/cocina/.test(s))c='cocina';else if(/balc|terraza/.test(s))c='balcon';
    else if(/principal/.test(s)&&!/baño|espacio/.test(s))c='hab1';else if(/habitaci|alcoba|cuarto/.test(s))c=!used.hab1?'hab1':!used.hab2?'hab2':'estudio';
    else if(/estudio|oficina/.test(s))c='estudio';else if(/baño|bano/.test(s))c=!used.bano1?'bano1':'bano2';else if(/ropas/.test(s))c='ropas';else if(/hall|pasillo/.test(s))c='hall';else c='r'+i;
    if(used[c])c=c+'_'+i;used[c]=1;return c}
  function pack(amb){
    var used={},R=(amb||[]).filter(function(a){return a.n&&a.w>0&&a.l>0}).map(function(a,i){return {id:rid(a.n,used,i),n:a.n,w:Math.round(a.w*100),h:Math.round(a.l*100)}});
    if(!R.length)return {w:600,h:400,rooms:[]};
    var tot=R.reduce(function(s,r){return s+r.w*r.h},0),W=Math.max(Math.max.apply(null,R.map(function(r){return r.w})),Math.round(Math.sqrt(tot)*1.3));
    var order=R.slice().sort(function(a,b){return b.h-a.h}),x=0,y=0,rh=0,mw=0;
    order.forEach(function(r){if(x>0&&x+r.w>W){y+=rh;x=0;rh=0}r.x=x;r.y=y;x+=r.w;rh=Math.max(rh,r.h);mw=Math.max(mw,x)});
    return {w:mw,h:y+rh,rooms:R};
  }
  function datosTypeform(p,modo){
    var d=p.datos,zona=d.zona||'Sur';
    var props=p.tipologias.map(function(t){
      var U=p.unidades.filter(function(u){return u.tipologia===t.id}),disp=U.filter(function(u){return u.estado==='disponible'});
      var precio=(disp.length?Math.min.apply(null,disp.map(function(u){return +u.precio||0})):+t.precio||0)*1e6;
      var inv=t.para==='inversion'||t.para==='ambos'||d.negocio==='colaborativa'||d.negocio==='renta',viv=t.para!=='inversion';
      return {id:t.id,n:(d.proyecto||'Proyecto')+' · '+t.nombre,zona:zona,barrio:d.ciudad||zona,lay:t.id,area:+t.area||0,hab:+t.hab||1,banos:+t.banos||1,precio:precio,
        renta:Math.round((+t.renta||precio/1e6*0.0055)*1e6),rentaCorta:inv?Math.round((+t.renta||precio/1e6*0.0055)*1.35*1e6):undefined,
        entrega:d.entrega||(d.negocio==='inmediata'?'Inmediata':'Por definir'),sala:'Sala '+(d.proyecto||'de ventas')+' · '+(d.salaDir||d.ciudad||''),

        A.map(function(a,j){return '<div class="r" data-ai="'+j+'"><input data-ak="n" value="'+esc(a.n)+'" aria-label="Ambiente"><input type="number" step="0.05" data-ak="w" value="'+esc(a.w)+'" aria-label="Ancho"><input type="number" step="0.05" data-ak="l" value="'+esc(a.l)+'" aria-label="Largo"><button class="x" type="button" data-arm aria-label="Quitar ambiente">×</button></div>'}).join('')+
        '<div class="row"><button class="b sm" type="button" data-aadd>+ Ambiente</button><button class="b sm" type="button" data-asug>Usar ambientes sugeridos</button><button class="b sm" type="button" data-aview>Recorrer '+esc(t.id)+' ↗</button></div></div><div class="plan" data-plan>'+planSVG(t)+'</div></div>'}).join('')+
      '<div class="box"><span class="kicker">Recorrido 3D (opcional)</span><p class="muted" style="font-size:13.5px">Sube el modelo en .glb u .obj y el sitio del instalador muestra el edificio en 3D con las unidades. Se guarda en este navegador.</p>'+
      '<div class="row"><label class="b upl">'+(cur.archivos.modelo?'Cambiar modelo':'Subir modelo 3D')+'<input type="file" id="m3d" accept=".glb,.gltf,.obj"></label><span class="state">'+(cur.archivos.modelo?esc(cur.archivos.modelo):'Sin modelo')+'</span>'+(cur.archivos.modelo?'<button class="b sm" id="m3dx" type="button">Quitar</button>':'')+'</div></div>'+
      '<div class="row"><label class="f" style="max-width:260px">Nombre de prueba del visitante<input id="vis" value="'+esc(R.visitante||'')+'" placeholder="Visitante"></label><button class="b p" id="rcOpen" type="button">Ver el recorrido ↗</button><button class="b" id="rcDl" type="button">Descargar recorrido.html</button></div>';
    if(!cur.tipologias.length)$('tp').insertAdjacentHTML('beforeend','<p class="state">Primero crea las tipologías en la pestaña Typeform.</p>');
    $('tp').querySelectorAll('.tip').forEach(function(box){var t=cur.tipologias[+box.dataset.ti];
      function plan(){box.querySelector('[data-plan]').innerHTML=planSVG(t);drawDots()}
      box.querySelectorAll('[data-ai]').forEach(function(r){var a=t.ambientes[+r.dataset.ai];
        r.querySelectorAll('[data-ak]').forEach(function(el){el.oninput=function(){a[el.dataset.ak]=el.type==='number'?+el.value:el.value;plan();sucio()}});
        r.querySelector('[data-arm]').onclick=function(){t.ambientes.splice(+r.dataset.ai,1);sucio();vRecorrido()}});
      box.querySelector('[data-aadd]').onclick=function(){(t.ambientes=t.ambientes||[]).push({n:'Ambiente',w:3,l:3});sucio();vRecorrido()};
      box.querySelector('[data-asug]').onclick=function(){t.ambientes=sugeridos(t.hab,t.area);sucio();vRecorrido()};
      box.querySelector('[data-aview]').onclick=function(){var q=JSON.parse(JSON.stringify(cur));q.tipologias=[t].concat(cur.tipologias.filter(function(x){return x!==t}));abrir(q,'recorrido')};
    });
    $('vis').oninput=function(e){R.visitante=e.target.value;sucio()};
    $('m3d').onchange=function(e){var f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>150e6){toast('El modelo pesa más de 150 MB');return}S.files.put(cur.id+':modelo',f).then(function(){cur.archivos.modelo=f.name;sucio();vRecorrido();toast('Modelo guardado en este navegador')})};
    if($('m3dx'))$('m3dx').onclick=function(){S.files.del(cur.id+':modelo');delete cur.archivos.modelo;sucio();vRecorrido()};
    $('rcOpen').onclick=function(){if(!cur.tipologias.length){toast('Primero crea las tipologías');return}abrir(cur,'recorrido')};
    $('rcDl').onclick=function(){if(!cur.tipologias.length){toast('Primero crea las tipologías');return}htmlAntonio(cur,'recorrido').then(function(h){dl(new Blob([h],{type:'text/html'}),slug(cur)+'-recorrido.html')})};
  }
  function vDashboard(){
    var U=cur.unidades,tot=U.reduce(function(s,u){return s+(+u.precio||0)},0),disp=U.filter(function(u){return u.estado==='disponible'}).length,vend=U.filter(function(u){return u.estado==='vendido'}).length;
    var opts=function(sel){return cur.tipologias.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===sel?' selected':'')+'>'+esc(t.nombre)+'</option>'}).join('')};
    $('tp').innerHTML=need('dashboard','Listo: descarga el dashboard con el sitio, el Typeform y el recorrido.')+
      '<div class="box drop" id="dropDash"><span class="kicker">Importar la sala 14 · JSON</span><p class="muted" style="font-size:13.5px">Trae pisos, unidades, áreas, alcobas, baños, precios y estados desde el .sala.zip, proyecto.json o datos.js de la sala de renders. Reemplaza las tipologías y unidades de este proyecto.'+(cur.sala14?' Última importación: '+cur.sala14.pisos+' pisos y '+cur.sala14.plantas+' plantas.':'')+'</p><label class="b upl" style="width:fit-content">Importar JSON de la sala 14<input type="file" id="imp14" accept=".zip,.json,.js"></label></div>'+
      '<div class="stats"><div><b>'+U.length+'</b><span>unidades</span></div><div><b>'+disp+'</b><span>disponibles</span></div><div><b>'+vend+'</b><span>vendidas</span></div><div><b>'+cop(tot)+'</b><span>inventario</span></div></div>'+
      (cur.tipologias.length?'<div class="box"><span class="kicker">Crear unidades desde las tipologías</span><div class="row"><label class="f">Tipología<select id="gT">'+opts()+'</select></label><label class="f">Cantidad<input id="gN" type="number" value="8" style="width:90px"></label><label class="f">Por piso<input id="gP" type="number" value="4" style="width:90px"></label><label class="f">Desde el piso<input id="gF" type="number" value="2" style="width:90px"></label><button class="b" id="gGo" type="button">Agregar unidades</button></div></div>':'<p class="state">Crea tipologías en la pestaña Typeform o importa la sala 14.</p>')+
      (U.length?'<div class="row"><label class="f">Ajustar precios de<select id="aT"><option value="">Todas</option>'+opts()+'</select></label><label class="f">%<input id="aP" type="number" value="3" style="width:80px"></label><button class="b" id="aGo" type="button">Aplicar</button></div>'+
      '<div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>Unidad</th><th>Tipología</th><th>Piso</th><th>Área m²</th><th>Precio (M)</th><th>Estado</th><th></th></tr></thead><tbody>'+U.map(function(u,i){
        return '<tr data-u="'+i+'"><td><input data-uk="id" value="'+esc(u.id)+'" style="width:90px"></td><td><select data-uk="tipologia">'+opts(u.tipologia)+'</select></td><td><input type="number" data-uk="piso" value="'+esc(u.piso)+'"></td><td><input type="number" step="any" data-uk="area" value="'+esc(u.area)+'"></td><td><input type="number" step="any" data-uk="precio" value="'+esc(u.precio)+'"></td><td><select data-uk="estado">'+['disponible','reservado','vendido'].map(function(s){return '<option'+(s===u.estado?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td><button class="x" type="button" data-urm aria-label="Quitar unidad">×</button></td></tr>'}).join('')+'</tbody></table></div>':'')+
      '<div class="row"><button class="b p" id="zip" type="button">Descargar dashboard (.zip)</button><span class="state" id="zst">Trae el dashboard (precios, estados, tutoriales y dominio), el sitio 3D, el Typeform y el recorrido virtual.</span></div>';
    var dz=$('dropDash');dz.ondragover=function(e){e.preventDefault();dz.classList.add('over')};dz.ondragleave=function(){dz.classList.remove('over')};
    dz.ondrop=function(e){e.preventDefault();dz.classList.remove('over');var f=e.dataTransfer.files[0];if(f)imp(f)};
    $('imp14').onchange=function(e){var f=e.target.files[0];e.target.value='';if(f)imp(f)};
    function imp(f){leerArchivo(f).then(function(r){if(r.S)fromRenders(r.S,cur);else{var q=fromPedido(r.D,cur.origen);cur.tipologias=q.tipologias;cur.unidades=q.unidades}cur.origen=r.S?'Sala 14 · renders':cur.origen;return guardarArchivos(cur,r)}).then(function(){sucio();draw();toast('Sala 14 importada: '+cur.unidades.length+' unidades')}).catch(function(e){toast(e.message)})}
    if($('gGo'))$('gGo').onclick=function(){var t=tipo(cur,$('gT').value),n=+$('gN').value||0,per=Math.max(1,+$('gP').value||1),f0=+$('gF').value||1;if(!t||n<1)return;
      var used={};cur.unidades.forEach(function(u){used[u.id]=1});var k=0,piso=f0,slot=1;
      while(k<n){var id=String(piso*100+slot);if(!used[id]){cur.unidades.push({id:id,tipologia:t.id,piso:piso,area:+t.area||0,precio:Math.round((+t.precio||0)*(1+0.004*(piso-f0))),estado:'disponible'});used[id]=1;k++}slot++;if(slot>per){slot=1;piso++}}
      sucio();vDashboard();drawDots()};
    if($('aGo'))$('aGo').onclick=function(){var t=$('aT').value,pc=+$('aP').value||0;cur.unidades.forEach(function(u){if(!t||u.tipologia===t)u.precio=Math.round(u.precio*(1+pc/100)*10)/10});sucio();vDashboard()};
    $('tp').querySelectorAll('tr[data-u]').forEach(function(tr){var u=cur.unidades[+tr.dataset.u];
      tr.querySelectorAll('[data-uk]').forEach(function(el){el.onchange=function(){u[el.dataset.uk]=el.type==='number'?+el.value:el.value;sucio();if(el.dataset.uk==='precio'||el.dataset.uk==='estado')vDashboard()}});
      tr.querySelector('[data-urm]').onclick=function(){cur.unidades.splice(+tr.dataset.u,1);sucio();vDashboard()}});
    $('zip').onclick=function(){if(!cur.unidades.length){toast('Agrega unidades antes de descargar');return}var b=this;b.disabled=true;$('zst').textContent='Armando el dashboard…';
      instalador(cur).then(function(o){dl(o.blob,o.filename);$('zst').textContent='✓ '+o.filename+' descargado';$('zst').className='state ok'}).catch(function(e){$('zst').textContent=e.message;$('zst').className='state bad'}).then(function(){b.disabled=false})};
  }
  function vLinks(){
    $('tp').innerHTML='<p class="muted">Cuando publiques cada pieza, pega aquí su link. Así cada proyecto tiene en un solo lugar su Typeform, su recorrido, su sala de renders, su dashboard publicado y su propuesta.</p><div class="box">'+
      LINKS.map(function(l){return '<div class="lk"><label for="L-'+l[0]+'">'+l[1]+'<small>'+l[2]+'</small></label><input id="L-'+l[0]+'" data-l="'+l[0]+'" type="url" placeholder="https://…" value="'+esc(cur.links[l[0]]||'')+'"><a class="b sm" data-open="'+l[0]+'" target="_blank" rel="noopener"'+(cur.links[l[0]]?' href="'+esc(cur.links[l[0]])+'"':'')+'>Abrir ↗</a></div>'}).join('')+'</div>'+
      '<div class="row"><button class="b" id="cp" type="button">Copiar links</button><button class="b" id="ex" type="button">Exportar links de todos los proyectos (.json)</button></div>';
    $('tp').querySelectorAll('[data-l]').forEach(function(i){i.onchange=function(){cur.links[i.dataset.l]=i.value.trim();var a=$('tp').querySelector('[data-open="'+i.dataset.l+'"]');if(i.value.trim())a.href=i.value.trim();else a.removeAttribute('href');sucio()}});
    $('tp').querySelectorAll('[data-open]').forEach(function(a){a.onclick=function(e){if(!a.getAttribute('href')){e.preventDefault();toast('Pega primero el link')}}});
    $('cp').onclick=function(){var t=(cur.datos.proyecto||'Proyecto')+'\n'+LINKS.map(function(l){return l[1]+': '+(cur.links[l[0]]||'—')}).join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Links copiados')},function(){toast('No se pudo copiar')})};
    $('ex').onclick=function(){dl(new Blob([JSON.stringify(P.map(function(p){return {proyecto:p.datos.proyecto,origen:p.origen,links:p.links}}),null,2)],{type:'application/json'}),'links-salas-life-city.json')};
  }

  /* ===================== fuentes ===================== */
  function nuevo(){var p=blank();agregar(p,'Proyecto creado. Empieza por los datos del proyecto.')}
  $('nuevo').onclick=nuevo;
  $('fileNew').onchange=function(e){var f=e.target.files[0];e.target.value='';if(f)importarNuevo(f).catch(function(err){toast(err.message)})};
  var dr=$('drop');dr.ondragover=function(e){e.preventDefault();dr.classList.add('over')};dr.ondragleave=function(){dr.classList.remove('over')};
  dr.ondrop=function(e){e.preventDefault();dr.classList.remove('over');var f=e.dataTransfer.files[0];if(f)importarNuevo(f).catch(function(err){toast(err.message)})};
  $('fromKit').onclick=function(){LCKit.load().then(function(r){if(!r.pedido){toast('No hay pedidos de la Sales App en este navegador');return}
    var p=fromPedido(r.pedido,'Sales App 3D');guardarArchivos(p,{modelo:r.model?new File([r.model.blob],r.model.name):null}).then(function(){agregar(p,'Pedido de la Sales App agregado')})})};
  $('fromAntonio').onclick=function(){
    var p=blank();p.origen='Antonio';Object.assign(p.datos,{proyecto:'La Vista de San Eduardo',empresa:'Constructora de Antonio',director:'Antonio',whatsapp:'',ciudad:'Cali',zona:'Sur',negocio:'planos',entrega:'Dic. 2027',salaDir:''});
    var t=nuevaTip(p,{nombre:'Tipo A · 121 m²',area:121,hab:3,banos:2,precio:585,renta:3.1,para:'ambos'});
    p.unidades=[['U-201',585,'disponible',2],['U-215',598,'reservado',2],['U-501',612,'disponible',5],['U-815',640,'disponible',8],['U-1015',668,'disponible',10],['U-1101',695,'disponible',11]].map(function(x){return {id:x[0],tipologia:t.id,piso:x[3],area:121,precio:x[1],estado:x[2]}});
    Object.assign(p.links,{typeform:BASE+'antonio/typeform.html',recorrido:'https://vista-san-eduardo.netlify.app/',propuesta:BASE+'antonio/propuesta.html'});
    agregar(p,'San Eduardo agregado: completa el WhatsApp y la dirección de la sala');
  };

  S.init(function(e){st=e;cargar()});
})();
</script>
